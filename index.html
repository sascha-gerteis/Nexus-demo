<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI | Master Website</title>
  <meta name="description" content="Nexus AI master marketplace website with home, marketplace, about, contact, login, and dashboards in one file." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#132f55;
      --primary2:#1d4b7f;
      --ink:#102033;
      --muted:#64748b;
      --blue:#0ea5e9;
      --blue2:#e8f7ff;
      --green:#10b981;
      --green2:#ecfdf5;
      --purple:#8b5cf6;
      --purple2:#f5f3ff;
      --orange:#f59e0b;
      --orange2:#fff7ed;
      --red:#ef4444;
      --red2:#fef2f2;
      --bg:#f7fafc;
      --card:#ffffff;
      --line:#e5e7eb;
      --soft-line:#edf2f7;
      --shadow:0 18px 50px rgba(15,23,42,.08);
      --shadow2:0 10px 28px rgba(15,23,42,.06);
      --radius-xl:32px;
      --radius-lg:24px;
      --radius-md:16px;
      --container:1220px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:#fff;
      line-height:1.55;
      overflow-x:hidden;
    }
    a{text-decoration:none;color:inherit}
    button,input,select,textarea{font-family:inherit}
    button{cursor:pointer}
    .container{max-width:var(--container);margin:0 auto;padding:0 1.5rem}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .full{grid-column:1/-1}

    header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(226,232,240,.82);
    }
    .nav{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      padding:.8rem 0;
    }
    .logo{
      border:0;
      background:transparent;
      display:flex;
      align-items:center;
      gap:.65rem;
      color:var(--primary);
      font-size:1.55rem;
      font-weight:950;
      letter-spacing:-.045em;
      white-space:nowrap;
    }
    .logo-mark{
      width:40px;
      height:40px;
      border-radius:14px;
      display:grid;
      place-items:center;
      color:#fff;
      background:linear-gradient(135deg,var(--primary),var(--blue));
      box-shadow:0 12px 26px rgba(14,165,233,.2);
      font-size:1rem;
      font-weight:900;
      letter-spacing:0;
    }
    .logo span:last-child{color:var(--blue)}
    .nav-links{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;justify-content:flex-end}
    .nav-link{
      border:0;
      background:transparent;
      color:#475569;
      font-weight:800;
      font-size:.92rem;
      padding:.65rem .78rem;
      border-radius:12px;
      transition:.16s ease;
    }
    .nav-link:hover,.nav-link.active{background:#eff8ff;color:#0369a1}

    .btn{
      border:0;
      border-radius:14px;
      padding:.9rem 1.05rem;
      font-weight:900;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.45rem;
      transition:.18s ease;
      white-space:nowrap;
      line-height:1;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;box-shadow:0 14px 30px rgba(14,165,233,.23)}
    .btn-dark{background:var(--primary);color:#fff}
    .btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line)}
    .btn-soft{background:#f8fafc;color:var(--primary);border:1px solid var(--line)}
    .btn-danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    .btn-small{padding:.62rem .78rem;font-size:.84rem;border-radius:11px}
    .btn-full{width:100%}
    .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      padding:.46rem .75rem;
      border:1px solid rgba(14,165,233,.28);
      background:rgba(14,165,233,.08);
      color:#075985;
      border-radius:999px;
      font-size:.82rem;
      font-weight:900;
      letter-spacing:.02em;
    }
    .eyebrow::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--blue);box-shadow:0 0 16px rgba(14,165,233,.65)}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:.35rem;
      border:1px solid #e2e8f0;
      background:#fff;
      border-radius:999px;
      padding:.36rem .58rem;
      font-size:.74rem;
      font-weight:900;
      color:#475569;
      white-space:nowrap;
    }
    .pill.green{background:#ecfdf5;color:#047857;border-color:#bbf7d0}
    .pill.blue{background:#eff6ff;color:#0369a1;border-color:#bfdbfe}
    .pill.orange{background:#fff7ed;color:#b45309;border-color:#fed7aa}
    .pill.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
    .pill.purple{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
    .tag{background:#f1f5f9;color:#526174;border-radius:999px;padding:.3rem .5rem;font-size:.74rem;font-weight:850}
    .tag-row,.tags{display:flex;flex-wrap:wrap;gap:.38rem;margin:.8rem 0}

    .hero{
      position:relative;
      overflow:hidden;
      padding:5.2rem 0 4rem;
      background:
        radial-gradient(circle at 12% 15%,rgba(14,165,233,.16),transparent 28%),
        radial-gradient(circle at 88% 0%,rgba(139,92,246,.13),transparent 30%),
        linear-gradient(135deg,#f8fbff,#f3f8ff 48%,#fff);
      border-bottom:1px solid #eaf0f7;
    }
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}
    h1{font-size:clamp(2.65rem,5vw,5.1rem);line-height:.96;letter-spacing:-.07em;color:var(--primary);margin:1rem 0 1.2rem;font-weight:950}
    h1 span{background:linear-gradient(135deg,var(--blue),#2563eb,var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero p{color:var(--muted);font-size:1.12rem;max-width:740px;margin-bottom:1.45rem;line-height:1.75}
    .hero-actions{display:flex;gap:.85rem;flex-wrap:wrap;margin:1.5rem 0}
    .trust-row{display:flex;flex-wrap:wrap;gap:.55rem}
    .trust-row span{padding:.5rem .72rem;border:1px solid #e2e8f0;background:#fff;border-radius:999px;color:#526174;font-weight:850;font-size:.85rem;box-shadow:0 8px 20px rgba(15,23,42,.04)}
    .hero-panel{background:rgba(255,255,255,.82);border:1px solid rgba(226,232,240,.88);border-radius:30px;padding:1rem;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .panel-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1rem .75rem;font-weight:950;color:var(--primary)}
    .mini-stack{display:grid;gap:.75rem}
    .mini-card{display:grid;grid-template-columns:auto 1fr auto;gap:.85rem;align-items:center;border:1px solid #e8edf5;background:#fff;border-radius:18px;padding:1rem;box-shadow:0 10px 26px rgba(15,23,42,.05)}
    .mini-card h3{font-size:.96rem;color:var(--primary);margin-bottom:.1rem;line-height:1.15}
    .mini-card p{font-size:.8rem;color:var(--muted);margin:0;line-height:1.45}
    .price{color:var(--primary);font-weight:950;text-align:right}

    .section{padding:4.6rem 0}
    .section.light{background:var(--bg);border-top:1px solid #edf2f7;border-bottom:1px solid #edf2f7}
    .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;margin-bottom:1.65rem}
    .section-head.center{text-align:center;display:block;max-width:820px;margin:0 auto 1.8rem}
    .section-head h2{color:var(--primary);font-size:clamp(2rem,3vw,3.1rem);line-height:1;letter-spacing:-.055em;font-weight:950;margin-top:.7rem}
    .section-head p{color:var(--muted);max-width:700px;margin-top:.7rem;line-height:1.7}

    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
    .card,.product-card{background:#fff;border:1px solid #e6edf6;border-radius:24px;padding:1.15rem;box-shadow:var(--shadow2)}
    .card.highlight{background:radial-gradient(circle at 88% 0%,rgba(14,165,233,.10),transparent 32%),#fff;box-shadow:var(--shadow)}
    .card h2,.card h3{color:var(--primary);letter-spacing:-.04em;line-height:1.1}
    .card h2{font-size:2rem;margin:.8rem 0 .7rem}
    .card h3{font-size:1.22rem;margin:.7rem 0 .45rem}
    .card p{color:var(--muted);line-height:1.7}
    .icon{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:950;font-size:.95rem;flex:0 0 auto}
    .icon.blue{background:var(--blue2);color:#0369a1}
    .icon.green{background:#dcfce7;color:#047857}
    .icon.purple{background:#ede9fe;color:#6d28d9}
    .icon.orange{background:var(--orange2);color:#b45309}
    .icon.red{background:var(--red2);color:#b91c1c}

    .toolbar{position:sticky;top:76px;z-index:45;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid #edf2f7;padding:1rem 0}
    .toolbar-card{display:grid;grid-template-columns:1fr 180px 180px auto;gap:.75rem;align-items:center}
    input,select,textarea,.input,.select{width:100%;border:1px solid #dbe4ef;border-radius:14px;padding:.92rem 1rem;background:#fff;outline:none;color:var(--ink);font-size:.95rem}
    textarea{min-height:118px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:rgba(14,165,233,.55);box-shadow:0 0 0 4px rgba(14,165,233,.09)}
    label{display:block;color:var(--primary);font-weight:850;font-size:.86rem;margin-bottom:.35rem}
    .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
    .chip{border:1px solid #e2e8f0;background:#fff;color:#475569;padding:.58rem .78rem;border-radius:999px;font-weight:850;transition:.16s ease}
    .chip.active,.chip:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

    .market-layout{display:grid;grid-template-columns:280px 1fr;gap:1.4rem;align-items:start}
    .sidebar{position:sticky;top:172px;background:#fff;border:1px solid #e6edf6;border-radius:22px;padding:1.1rem;box-shadow:var(--shadow2)}
    .sidebar h3{color:var(--primary);font-size:1rem;margin-bottom:.7rem}
    .side-group{border-top:1px solid #edf2f7;margin-top:1rem;padding-top:1rem}
    .check{display:flex;gap:.6rem;color:#526174;font-weight:680;font-size:.9rem;margin:.7rem 0;align-items:flex-start}
    .check input{width:auto;margin-top:.22rem;box-shadow:none}
    .product-card{position:relative;overflow:hidden;transition:.18s ease;display:flex;flex-direction:column;min-height:385px}
    .product-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfe0f5}
    .product-card:before{content:"";position:absolute;right:-60px;top:-70px;width:150px;height:150px;border-radius:50%;background:rgba(14,165,233,.06)}
    .product-top{position:relative;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:.85rem}
    .product-card h3{position:relative;color:var(--primary);font-size:1.18rem;line-height:1.15;letter-spacing:-.02em;margin-bottom:.5rem}
    .product-card p{position:relative;color:var(--muted);font-size:.92rem;margin-bottom:.9rem;line-height:1.55}
    .meta-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:.9rem 0}
    .meta{border:1px solid #edf2f7;background:#f8fafc;border-radius:14px;padding:.65rem}
    .meta span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:950}
    .meta strong{display:block;color:var(--primary);font-size:.87rem;margin-top:.15rem}
    .card-actions{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:auto}

    .dashboard-layout{display:grid;grid-template-columns:250px 1fr;gap:1.2rem;align-items:start}
    .dash-nav{background:#fff;border:1px solid #e6edf6;border-radius:22px;padding:1rem;box-shadow:var(--shadow2);position:sticky;top:96px}
    .dash-identity{background:radial-gradient(circle at 90% 0%,rgba(14,165,233,.12),transparent 38%),#f8fafc;border:1px solid #edf2f7;border-radius:18px;padding:1rem;margin-bottom:.75rem}
    .dash-identity strong{display:block;color:var(--primary);font-size:1rem}
    .dash-identity span{display:block;color:var(--muted);font-size:.84rem;margin-top:.2rem}
    .dash-nav button{width:100%;text-align:left;border:0;background:transparent;padding:.8rem .85rem;border-radius:12px;color:#475569;font-weight:850;display:flex;justify-content:space-between;gap:.6rem;align-items:center}
    .dash-nav button.active,.dash-nav button:hover{background:#eff6ff;color:#0369a1}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1rem}
    .stat{background:#fff;border:1px solid #e6edf6;border-radius:20px;padding:1rem;box-shadow:var(--shadow2)}
    .stat span{color:#94a3b8;font-weight:950;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
    .stat strong{display:block;color:var(--primary);font-size:1.65rem;margin-top:.2rem;letter-spacing:-.04em}
    .table-wrap{overflow:auto;border:1px solid #e6edf6;border-radius:20px;background:#fff;box-shadow:var(--shadow2)}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:.95rem;border-bottom:1px solid #edf2f7;text-align:left;font-size:.9rem;vertical-align:top}
    th{color:#64748b;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;background:#fbfdff}
    td strong{color:var(--primary)}
    tr:last-child td{border-bottom:0}
    .activity{display:grid;gap:.7rem}
    .activity-row{display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:start;background:#f8fafc;border:1px solid #edf2f7;border-radius:18px;padding:.85rem}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:.35rem}.dot.warn{background:var(--orange)}.dot.err{background:var(--red)}

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
    .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0}
    .choice-card{border:1px solid #e6edf6;background:#fff;border-radius:24px;padding:1.3rem;box-shadow:var(--shadow2);cursor:pointer;transition:.18s ease}
    .choice-card:hover,.choice-card.selected{border-color:var(--blue);box-shadow:0 14px 30px rgba(14,165,233,.14)}
    .choice-card h3{color:var(--primary);margin-bottom:.5rem}
    .choice-card p{color:var(--muted);font-size:.94rem;line-height:1.6}

    .modal-backdrop{position:fixed;inset:0;z-index:220;background:rgba(15,23,42,.62);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:1rem}
    .modal-backdrop.open{display:flex}
    .modal{width:min(1200px,100%);max-height:92vh;overflow:hidden;background:#fff;border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.3);display:grid;grid-template-columns:.88fr 1.12fr}
    .modal.single{display:block;width:min(760px,100%)}
    .modal-side,.modal-main{padding:1.25rem;overflow:auto;max-height:92vh}
    .modal-side{border-right:1px solid #edf2f7}
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.8rem}
    .modal h2{color:var(--primary);font-size:2rem;line-height:1;letter-spacing:-.04em;margin:.65rem 0}
    .close{border:0;background:#f1f5f9;color:#334155;border-radius:12px;padding:.65rem .8rem;font-weight:900}
    .info-block{border:1px solid #edf2f7;background:#f8fafc;border-radius:18px;padding:1rem;margin:1rem 0}
    .info-block h4{color:var(--primary);font-size:.95rem;margin-bottom:.45rem}
    .info-block p,.info-block li{color:#526174;font-size:.9rem;line-height:1.55}
    ul.clean{padding-left:1.1rem}ul.clean li{margin:.35rem 0}
    .price-box{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #dbeafe;border-radius:18px;padding:1rem;margin:1rem 0}
    .price-box span{color:var(--muted);font-weight:850;font-size:.88rem}.price-box strong{display:block;color:var(--primary);font-size:1.65rem}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.65rem;margin-top:1rem}

    .preview-shell{border-radius:24px;background:#0f172a;padding:.85rem;color:#fff;box-shadow:var(--shadow);margin-bottom:1rem}
    .browser-bar{height:34px;display:flex;align-items:center;gap:.4rem;padding:0 .45rem;color:#cbd5e1;font-size:.78rem;font-weight:850}
    .browser-dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}.browser-dot.red{background:#fb7185}.browser-dot.yellow{background:#fbbf24}.browser-dot.green{background:#34d399}
    .preview-window{background:#fff;color:var(--ink);border-radius:18px;padding:1rem;min-height:380px}
    .preview-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;border-bottom:1px solid #edf2f7;padding-bottom:.8rem;margin-bottom:.8rem}
    .preview-header h3{color:var(--primary);line-height:1.1}.preview-header p{color:var(--muted);font-size:.86rem;margin-top:.25rem}
    .preview-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:.8rem 0}
    .preview-kpi{background:#f8fafc;border:1px solid #edf2f7;border-radius:15px;padding:.75rem}
    .preview-kpi span{display:block;color:#94a3b8;font-size:.7rem;text-transform:uppercase;font-weight:950}.preview-kpi strong{display:block;color:var(--primary);font-size:1.15rem}
    .preview-row{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid #edf2f7;padding:.74rem 0;gap:1rem;font-size:.9rem}.preview-row strong{color:var(--primary)}
    .preview-chat{display:grid;gap:.65rem}.bubble{padding:.75rem;border-radius:16px;max-width:90%;font-size:.9rem}.bubble.user{background:#eff6ff;color:#075985;justify-self:start}.bubble.bot{background:#ecfdf5;color:#065f46;justify-self:end}

    footer{background:#0b1220;color:#cbd5e1;padding:2rem 0;margin-top:0}
    .footer-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.footer-links{display:flex;gap:1rem;flex-wrap:wrap}.footer-links button{border:0;background:transparent;color:#cbd5e1;font-weight:750}.footer-links button:hover{color:#fff}
    .toast{position:fixed;right:1rem;bottom:1rem;z-index:600;background:var(--primary);color:#fff;padding:.9rem 1rem;border-radius:14px;box-shadow:var(--shadow);display:none;font-weight:850;max-width:min(440px,calc(100vw - 2rem))}.toast.show{display:block}

    @media(max-width:1080px){.hero-grid,.market-layout,.dashboard-layout,.modal{grid-template-columns:1fr}.modal-side{border-right:0;border-bottom:1px solid #edf2f7}.sidebar,.dash-nav{position:static}.grid{grid-template-columns:1fr 1fr}.grid-4,.stat-grid{grid-template-columns:1fr 1fr}.toolbar-card{grid-template-columns:1fr 1fr}.preview-kpis{grid-template-columns:1fr 1fr}}
    @media(max-width:720px){.nav{align-items:flex-start}.logo{font-size:1.35rem}.nav-links{gap:.35rem}.nav-link{padding:.55rem .55rem}.hero{padding:4rem 0 3.2rem}h1{font-size:2.55rem}.hero-actions,.modal-actions{grid-template-columns:1fr;flex-direction:column}.btn{width:100%}.toolbar{top:88px}.toolbar-card,.grid,.grid-2,.grid-4,.choice-grid,.form-grid,.stat-grid,.card-actions,.meta-grid,.preview-kpis{grid-template-columns:1fr}.mini-card{grid-template-columns:auto 1fr}.mini-card .price{grid-column:1/-1;text-align:left}.section-head{display:block}.market-layout{display:block}.sidebar{margin-bottom:1rem}.preview-header{display:block}.preview-row{grid-template-columns:1fr}.footer-row{display:block}.footer-links{margin-top:1rem}}
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <button class="logo" onclick="go('home')" aria-label="Go to Nexus AI home"><span class="logo-mark">N</span><span>Nexus</span><span>AI</span></button>
      <nav class="nav-links" id="navLinks"></nav>
    </div>
  </header>

  <main id="app"></main>

  <div class="modal-backdrop" id="productModal">
    <div class="modal">
      <div class="modal-side" id="modalSide"></div>
      <div class="modal-main" id="modalMain"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="questionModal">
    <div class="modal single">
      <div class="modal-main">
        <div class="modal-head">
          <div>
            <span class="pill blue">Ask before buying</span>
            <h2>Ask Nexus a question</h2>
            <p class="muted">Questions are routed through Nexus first. Developers can be escalated when technical review is needed.</p>
          </div>
          <button class="close" onclick="closeQuestion()">Close</button>
        </div>
        <div class="form-grid">
          <div><label>Your email</label><input id="questionEmail" placeholder="you@company.com"></div>
          <div><label>Company</label><input id="questionCompany" placeholder="Company name"></div>
          <div class="full"><label>Question</label><textarea id="questionText" placeholder="Ask about setup, integrations, customization, hosting, data privacy, or pricing..."></textarea></div>
        </div>

      if(tab==='questions') return DashboardShell('developer', stats + Table(['Product','Company','Question','Status','Date'], questions.map(q=>[`<strong>${q.productTitle}</strong>`,q.company,q.question,statusPill('Routed via Nexus'),q.createdAt])));
      if(tab==='installs') return DashboardShell('developer', stats + Table(['Buyer','Automation','Status','Revenue','Support','Date'], [['Acme Hotels','Invoice Processing Automation','Active','$499','None','Today'],['BluePeak Agency','Invoice Processing Automation','Active','$499','Question open','Yesterday'],['Northstar Finance','Invoice Processing Automation','Setup','$499','Needs mapping','3 days ago']].map(r=>[`<strong>${r[0]}</strong>`,r[1],statusPill(r[2]),r[3],r[4],r[5]])));
      if(tab==='analytics') return DashboardShell('developer', stats + `<div class="grid-4">${[['Views','1,840'],['Conversion','6.4%'],['Avg rating','4.5'],['Open support','1']].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="card" style="margin-top:1rem"><h2>Analytics</h2><p class="muted">Demo marketplace analytics. Connect production events later.</p></div>`);
      return DashboardShell('developer', stats + `<div class="card"><h2>Payouts</h2><p class="muted">Demo payouts view. Stripe Connect or another payout provider can be added later.</p><div class="price-box"><span>Estimated gross</span><strong>$4,491</strong></div></div>`);
    }
    function SubmitAutomationForm(subs){
      return `<div class="card" style="margin-bottom:1rem"><h2>Submit / upload automation</h2><p class="muted" style="margin-bottom:1rem">Developers do not host customer automations. Submit the listing, workflow details, runtime requirements, code/package handoff notes, input/output schema, and hosting requirements. Nexus reviews, packages, hosts, and monitors the automation.</p><div class="form-grid"><div><label>Automation title</label><input id="subTitle" placeholder="AI Invoice Processing Agent"></div><div><label>Category</label><select id="subCategory">${['Sales','Marketing','Customer Support','Operations','Finance','HR','Reporting','E-commerce'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Pricing type</label><select id="subType"><option>Monthly</option><option>One-time</option><option>Monthly + setup</option></select></div><div><label>Monthly price</label><input id="subMonthly" type="number" placeholder="99"></div><div><label>One-time/setup price</label><input id="subOneTime" type="number" placeholder="299"></div><div><label>Complexity</label><select id="subComplexity"><option>Easy</option><option>Medium</option><option>Advanced</option></select></div><div class="full"><label>Short marketplace description</label><input id="subShort" placeholder="Short product card description"></div><div class="full"><label>Full customer-facing description</label><textarea id="subDescription" placeholder="Explain what it does, who it is for, how it works..."></textarea></div><div><label>Required integrations</label><input id="subIntegrations" placeholder="HubSpot, Gmail, Slack"></div><div><label>Buyer credentials needed</label><input id="subCredentials" placeholder="API key, account access, webhook"></div><div class="full"><label>Runtime / hosting handoff notes for Nexus</label><textarea id="subRuntime" placeholder="How Nexus should host this: runtime, environment variables, API calls, cron schedule, input schema, output schema, limits..."></textarea></div><div class="full"><label>Security / data handling notes</label><textarea id="subSecurity" placeholder="Data stored, API keys required, external APIs used, retention concerns..."></textarea></div><div class="full"><label>Support notes</label><textarea id="subSupport" placeholder="What support the developer provides to Nexus, not directly to buyer..."></textarea></div></div><button class="btn btn-soft" style="margin-top:1rem" onclick="saveSubmission('draft')">Save draft</button> <button class="btn btn-primary" style="margin-top:1rem" onclick="saveSubmission('pending')">Submit to Nexus review</button></div>`;
    }
    function saveSubmission(status){
      const s=getStore();
      s.submissions.unshift({id:'sub-'+Date.now(), seller:state.user?.company || 'Demo Developer', title:val('subTitle') || 'Untitled Automation', category:val('subCategory'), type:val('subType'), monthlyPrice:val('subMonthly'), oneTimePrice:val('subOneTime'), complexity:val('subComplexity'), short:val('subShort'), description:val('subDescription') || 'No description yet.', integrations:val('subIntegrations'), credentials:val('subCredentials'), runtime:val('subRuntime'), security:val('subSecurity'), support:val('subSupport'), setup:'Nexus review + 3-7 days', status, createdAt:new Date().toLocaleString()});
      saveStore(s); toast(status==='pending'?'Submitted to Nexus hosting review':'Draft saved'); state.dashTab.developer='listings'; render();
    }

    function AdminDashboard(){
      const s=getStore(); const tab=state.dashTab.admin; const pending=s.submissions.filter(x=>x.status==='pending');
      const stats=`<div class="stat-grid"><div class="stat"><span>Orders</span><strong>${s.orders.length}</strong></div><div class="stat"><span>Questions</span><strong>${s.questions.length}</strong></div><div class="stat"><span>Hosting review</span><strong>${pending.length}</strong></div><div class="stat"><span>Marketplace</span><strong>${allProducts().length}</strong></div></div>`;
      if(tab==='overview') return DashboardShell('admin', stats + `<div class="grid-2"><div class="card"><h2>Nexus admin overview</h2><p class="muted">Review developer submissions, approve hosted listings, track questions, and monitor marketplace activity.</p></div><div class="card"><h2>Review policy</h2><p class="muted">Approve only after Nexus checks runtime, security, input/output schema, hosting requirements, and buyer setup needs.</p></div></div>`);
      if(tab==='reviews') return DashboardShell('admin', stats + Table(['Submission','Seller','Runtime notes','Security notes','Action'], pending.map(l=>[`<strong>${l.title}</strong><br><span class="muted">${String(l.description).slice(0,90)}...</span>`,l.seller,String(l.runtime||'No runtime notes').slice(0,120)+'...',String(l.security||'No security notes').slice(0,120)+'...',`<button class="btn btn-primary btn-small" onclick="reviewSubmission('${l.id}','approved')">Approve + publish</button> <button class="btn btn-danger btn-small" onclick="reviewSubmission('${l.id}','rejected')">Reject</button>`])));
      if(tab==='orders') return DashboardShell('admin', stats + Table(['Order','Buyer','Setup','Monthly','One-time','Status'], s.orders.map(o=>[`<strong>${o.productTitle}</strong><br><span class="muted">${o.createdAt}</span>`,o.company,o.setupType,money(o.priceMonthly),money(o.priceOneTime),statusPill(o.status)])));
      if(tab==='questions') return DashboardShell('admin', stats + Table(['Product','Company','Email','Question','Date'], s.questions.map(q=>[`<strong>${q.productTitle}</strong>`,q.company,q.email,q.question,q.createdAt])));
      if(tab==='contacts') return DashboardShell('admin', stats + Table(['Name','Email','Type','Message','Date'], s.contacts.map(c=>[`<strong>${c.name}</strong>`,c.email,c.type,c.message,c.createdAt])));
      return DashboardShell('admin', stats + Table(['Product','Seller','Category','Type','Price'], allProducts().map(p=>[`<strong>${p.title}</strong>`,p.seller,p.category,p.type,pricingText(p)])));
    }
    function reviewSubmission(id,status){const s=getStore();const item=s.submissions.find(x=>x.id===id);if(item)item.status=status;saveStore(s);toast('Submission '+status);render()}

    function Table(headers, rows){
      return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${headers.length}">No data yet.</td></tr>`}</tbody></table></div>`;
    }

    document.getElementById('productModal').addEventListener('click', e=>{ if(e.target.id==='productModal') closeProduct(); });
    document.getElementById('questionModal').addEventListener('click', e=>{ if(e.target.id==='questionModal') closeQuestion(); });
    render();
  </script>
</body>
</html>
